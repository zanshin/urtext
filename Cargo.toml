[package]
name = "urtext"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
pulldown-cmark = "0.13.1"
sha2 = "0.10.9"
hex = "0.4.3"
tera = "1.20.1"
tempfile = "3"
# clap - CLI argument parsing
# pulldown-cmark - Markdown to HTML
# tera - Templating engine
# serde + toml + serde_yaml - Config and front matter parsing
# gray_matter - Front matter extraction
# walkdir - Recursive directory traversal
# sha2 or blake3 - Hashing for incremental builds
# axum or tiny_http - Dev server
# notify - Filesystem watcher for live rebuild
# rayon - Parallel page rendering
# tokio - Async runtime
