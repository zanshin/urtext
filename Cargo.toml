[package]
name = "urtext"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.3"
tempfile = "3"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"
pulldown-cmark = "0.13.1"
axum = "0.8.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.102"
sha2 = "0.10.9"
hex = "0.4.3"
tera = "1.20.1"
walkdir = "2.5.0"
clap = { version = "4", features = ["derive"] }


# clap - CLI argument parsing
# toml + serde_yaml - Config and front matter parsing
# gray_matter - Front matter extraction
# walkdir - Recursive directory traversal
# notify - Filesystem watcher for live rebuild
# rayon - Parallel page rendering
