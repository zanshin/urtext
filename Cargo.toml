[package]
name = "urtext"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.3"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
pulldown-cmark = "0.13.1"
axum = "0.8.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# clap - CLI argument parsing
# tera - Templating engine
# toml + serde_yaml - Config and front matter parsing
# gray_matter - Front matter extraction
# walkdir - Recursive directory traversal
# sha2 or blake3 - Hashing for incremental builds
# axum or tiny_http - Dev server
# notify - Filesystem watcher for live rebuild
# rayon - Parallel page rendering
# tokio - Async runtime
